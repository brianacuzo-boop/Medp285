<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaxation Corner</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #1a2a3a;
      color: #fff;
      overflow: hidden;
    }

    .header {
      text-align: center;
      padding: 40px 0;
      background-color: #4d7c8d;
      font-size: 3em;
      color: #f0d0a2;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px;
      text-align: center;
      font-size: 1.5em;
      line-height: 1.6;
      color: #d1c9c0;
    }

    .box-container {
      display: flex;
      gap: 30px;
      margin-top: 40px;
    }

    .box {
      width: 200px;
      height: 200px;
      background: rgba(244, 224, 65, 0.2);
      border-radius: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .box:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
    }

    .box a {
      display: block;
      width: 100%;
      height: 100%;
      color: #1d1f27; /* Darker color for better readability */
      text-decoration: none;
      padding: 10px;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      background-color: rgba(244, 224, 65, 0.3);
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1d1f27;
    }

    .box a:hover {
      background-color: rgba(244, 224, 65, 0.5);
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: -1;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #fff;
      border-radius: 50%;
      animation: star-animation 1.5s infinite alternate;
    }

    @keyframes star-animation {
      0% {
        transform: translateY(-50px);
        opacity: 0;
      }
      100% {
        transform: translateY(50px);
        opacity: 1;
      }
    }

    .sky {
      background: linear-gradient(180deg, rgba(19, 48, 69, 0.8) 0%, rgba(21, 37, 50, 0.8) 100%);
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -2;
    }
  </style>
</head>
<body>

  <div class="sky"></div>

  <div class="header">
    Relaxation Corner
  </div>

  <div class="content">
    <div class="box-container">
      <div class="box">
        <a href="asmr.html">ASMR Relaxation</a>
      </div>
      <div class="box">
        <a href="yoga.html">Yoga Relaxation</a>
      </div>
    </div>
    <p>Explore different ways to relax and unwind</p>
  </div>

  <div class="stars">
  </div>

  <script>
    for (let i = 0; i < 200; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      document.querySelector('.stars').appendChild(star);
      star.style.top = Math.random() * window.innerHeight + 'px';
      star.style.left = Math.random() * window.innerWidth + 'px';
      star.style.animationDelay = Math.random() * 5 + 's';
    }
  </script>

</body>
</html>
