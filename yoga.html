<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoga Relaxation</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #1a2a3a;
      color: #fff;
      overflow: hidden;
    }

    .header {
      text-align: center;
      padding: 40px 0;
      background-color: #4d7c8d;
      font-size: 3em;
      color: #f0d0a2;
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px;
      text-align: center;
      font-size: 1.5em;
      line-height: 1.6;
      color: #d1c9c0;
    }

    .benefit {
      font-size: 1.2em;
      margin-top: 20px;
      max-width: 800px;
      text-align: center;
      line-height: 1.6;
      background: rgba(244, 224, 65, 0.3);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .playlist-link {
      text-decoration: none;
      color: #f4e041;
      font-size: 1.2em;
      margin-top: 20px;
      display: inline-block;
      padding: 10px 20px;
      border: 2px solid #f4e041;
      border-radius: 10px;
      background-color: transparent;
      transition: background-color 0.3s ease;
    }

    .playlist-link:hover {
      background-color: #f4e041;
      color: #1d1f27;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: -1;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #fff;
      border-radius: 50%;
      animation: star-animation 1.5s infinite alternate;
    }

    @keyframes star-animation {
      0% {
        transform: translateY(-50px);
        opacity: 0;
      }
      100% {
        transform: translateY(50px);
        opacity: 1;
      }
    }

    .sky {
      background: linear-gradient(180deg, rgba(19, 48, 69, 0.8) 0%, rgba(21, 37, 50, 0.8) 100%);
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -2;
    }
  </style>
</head>
<body>

  <div class="sky"></div>

  <div class="header">
    Yoga Relaxation
  </div>

  <div class="content">
    <div class="benefit">
      <p>Yoga helps improve flexibility, reduce stress, and promote mindfulness. Relax your mind and body through some stretches.</p>
    </div>
    <a href="index.html" class="playlist-link">Back to Homepage</a>

  </div>

  <div class="stars">
  </div>
